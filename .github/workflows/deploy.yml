# Build the dodeca site and deploy it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DODECA_VERSION: v0.17.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The site JS lives in src/. dodeca does not rewrite relative ES module
      # imports, so bundle it into a single static/cyclone.js before building.
      - name: Bundle site JS
        run: |
          npm ci
          npm run build:js

      # The installer script pulls its `latest` pointer from an object-storage
      # bucket that no longer exists, so fetch the release tarball directly.
      - name: Install dodeca
        run: |
          mkdir -p "$RUNNER_TEMP/ddc"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/bearcove/dodeca/releases/download/${DODECA_VERSION}/dodeca-x86_64-unknown-linux-gnu.tar.xz" \
            -o "$RUNNER_TEMP/dodeca.tar.xz"
          tar -xJf "$RUNNER_TEMP/dodeca.tar.xz" -C "$RUNNER_TEMP/ddc"
          sudo install -m 0755 "$RUNNER_TEMP/ddc/ddc" /usr/local/bin/ddc
          ddc --version

      - name: Build site
        run: ddc build

      # dodeca 0.17 cache-busts everything under static/, so the CNAME has to be
      # written into the output after the build.
      - name: Write CNAME
        run: cp CNAME public/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
